name: Build

on:
  push:
    branches: [ main, 'release/**', 'feature/**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  XRAY_VERSION: v26.9.30
  SINGBOX_VERSION: 1.14.2
  SIGN: ${{ secrets.SIGNPATH_API_TOKEN != '' && github.ref_type == 'tag' }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:GITHUB_REF_NAME.TrimStart('v'); $label = $version }
          else { $version = ([xml](Get-Content Tunnelka.csproj)).Project.PropertyGroup.Version | Select-Object -First 1; $label = "dev-$($env:GITHUB_SHA.Substring(0, 7))" }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ZIP_NAME=Tunnelka-$label-win-x64.zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SETUP_NAME=Tunnelka-Setup-$version.exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Check storage encryption
        run: dotnet run --project tests/DpapiCheck/DpapiCheck.csproj -c Release

      - name: Publish
        run: dotnet publish Tunnelka.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:Version=${{ env.APP_VERSION }} -o publish

      - name: Upload app for signing
        id: unsigned-app
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-app
          path: publish/Tunnelka.exe

      - name: Sign app
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: publish

      - name: Add Xray and sing-box
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force publish/core | Out-Null
          Invoke-WebRequest "https://github.com/XTLS/Xray-core/releases/download/$env:XRAY_VERSION/Xray-windows-64.zip" -OutFile xray.zip
          Expand-Archive xray.zip -DestinationPath xray
          Copy-Item xray/xray.exe, xray/geoip.dat, xray/geosite.dat publish/core/
          Copy-Item xray/LICENSE publish/core/LICENSE-xray.txt
          Invoke-WebRequest "https://github.com/SagerNet/sing-box/releases/download/v$env:SINGBOX_VERSION/sing-box-$env:SINGBOX_VERSION-windows-amd64.zip" -OutFile singbox.zip
          Expand-Archive singbox.zip -DestinationPath singbox
          $dir = "singbox/sing-box-$env:SINGBOX_VERSION-windows-amd64"
          Copy-Item "$dir/sing-box.exe", "$dir/libcronet.dll" publish/core/
          Copy-Item "$dir/LICENSE" publish/core/LICENSE-sing-box.txt

      - name: Report contents
        shell: pwsh
        run: |
          $lines = Get-ChildItem publish -Recurse -File |
            Where-Object { $_.FullName -notmatch '[\\/]Assets[\\/](Flags|Fonts)[\\/]' } |
            ForEach-Object { "{0} {1:N1} MB" -f $_.FullName.Substring((Resolve-Path publish).Path.Length + 1), ($_.Length / 1MB) }
          $total = (Get-ChildItem publish -Recurse -File | Measure-Object Length -Sum).Sum / 1MB
          $text = ($lines + ("total {0:N1} MB" -f $total)) -join '%0A'
          Write-Output "::notice title=Contents::$text"

      - name: Pack
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath $env:ZIP_NAME

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=$env:APP_VERSION" "/DSourceDir=$PWD\publish" installer\Tunnelka.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "dist\$env:SETUP_NAME" .
          $size = (Get-Item $env:SETUP_NAME).Length / 1MB
          Write-Output ("::notice title=Installer::{0} {1:N1} MB" -f $env:SETUP_NAME, $size)

      - name: Upload installer for signing
        id: unsigned-setup
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup
          path: ${{ env.SETUP_NAME }}

      - name: Sign installer
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SETUP_NAME }}
          path: ${{ env.SETUP_NAME }}

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.SETUP_NAME }}
            ${{ env.ZIP_NAME }}
          generate_release_notes: true
